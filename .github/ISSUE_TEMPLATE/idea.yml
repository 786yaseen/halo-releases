name: Idea
description: Something Halo should do, or do differently.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Halo to do, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. What you do now without it.
