name: Bug report
description: Something in Halo doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping fix Halo. Please don't paste API keys, passwords, e-mails or anything private: this page is public.
  - type: input
    id: version
    attributes:
      label: Halo version
      description: Settings › Halo shows it, for example 1.0.0.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Press Ctrl+Shift+Space
        2. Ask "..."
        3. ...
  - type: dropdown
    id: area
    attributes:
      label: Part of Halo
      options: [Voice, Island, Studio, Notes, Doing things in apps, Browser, Google account, Install or update, Something else]
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
